name: 真实任务
description: 创建一个需要正式交付的真实任务
title: "[REAL] "
labels:
  - real-work
body:
  - type: input
    id: task_id
    attributes:
      label: 任务编号
      placeholder: RW-002
    validations:
      required: true
  - type: input
    id: summary
    attributes:
      label: 任务标题
      placeholder: 用一句话说明要做什么
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: 目标
      description: 这件事完成后，希望得到什么结果
    validations:
      required: true
  - type: textarea
    id: deliverables
    attributes:
      label: 交付内容
      description: 需要产出哪些文件、文档、页面或结果
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 完成标准
      description: 满足哪些条件才算完成
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: 备注
      description: 依赖、风险、时间要求、参考资料等
